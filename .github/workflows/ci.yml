  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks scans every commit, not just the checked-out tree.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - run: pnpm check:secrets
      # Allowlists and reviewed findings: docs/runbooks/secret-scanning.md
      - name: Scan full git history with gitleaks
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact --verbose --no-banner --exit-code 1 .

  dependency-scan:
