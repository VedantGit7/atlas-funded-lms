  browser-smoke:
    name: browser-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
          POSTGRES_DB: atlas_lms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_lms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      PLATFORM_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      BROWSER_E2E: "1"
      # Disposable HTTP auth/storage are development fixtures; production builds
      # retain their separate strict deployment checks and must not bypass them.
      BROWSER_E2E_DEV: "1"
      CI: "true"
      # Turns a missing credential into a failure instead of a skip. Ten of the
      # eleven journeys need a session; without this they skip, Playwright
      # reports the job green, and the absence of coverage is invisible.
      E2E_REQUIRE_AUTH_JOURNEYS: "1"
      E2E_OWNER_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      E2E_SCENARIO_PATH: .test-results/browser-scenario.json
      ATLAS_APP_LOGIN_PASSWORD: atlas_ci_app_only
      ATLAS_PLATFORM_LOGIN_PASSWORD: atlas_ci_platform_only
      E2E_TENANT_SLUG: fundedbeyond
      # The web proxy changes Host; platform writes validate the browser's
      # configured origin, not the API transport hostname.
      PLATFORM_HOST: platform.localhost
      E2E_PLATFORM_BASE_URL: http://platform.localhost:3000
      # The auth stack is local (supabase/config.toml), so these are the Supabase
      # CLI's well-known development keys rather than secrets. They are published
      # constants, identical on every machine, and grant nothing outside this
      # runner. Using a hosted project here would mean four secrets to maintain
      # and a suite no fork could run.
      E2E_SEED_PASSWORD: e2e-Journey-Password-1
      SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
        run: pnpm db:generate:ci
      - run: node scripts/db/ci-migrate-validate.mjs

      # Tenants are resolved by hostname, and `.test` is a reserved TLD that no
      # resolver answers for. Without these entries every page.goto fails with
      # ERR_NAME_NOT_RESOLVED — which is what the suite has been doing here,
      # since nothing ever added them and no job overrode the base URLs.
      - name: Resolve tenant hosts
        run: |
          sudo tee -a /etc/hosts >/dev/null <<'HOSTS'
          127.0.0.1 fundedbeyond.localhost.test
          127.0.0.1 second-smoke.localhost.test
          127.0.0.1 platform.localhost
          HOSTS
          getent hosts fundedbeyond.localhost.test

      # The hosts above only resolve to a server; these make them resolve to a
      # tenant. The visual and cross-tenant specs cover both academies, so both
      # manifests are applied.
      #
      # `--apply` is not optional: the seed runner defaults to dry-run, and a
      # dry-run seed step looks successful while inserting nothing — the browser
      # suite would then fail on hosts that resolve to no tenant.
      - run: pnpm db:seed:catalogues -- --apply
      - run: pnpm exec tsx --tsconfig backend/apps/api/tsconfig.json scripts/tenants/apply.ts --tenant fundedbeyond
      - run: pnpm exec tsx --tsconfig backend/apps/api/tsconfig.json scripts/tenants/apply.ts --tenant second-smoke-academy

      # Login goes through Supabase `signInWithPassword`, so the journeys need a
      # running auth stack. This starts GoTrue locally from supabase/config.toml
      # -- no hosted project, no secrets, and a fork can run the same suite.
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.117.0
      - name: Start local Supabase auth stack
        run: supabase start

      # Creates the Supabase users the authenticated journeys log in as, and the
      # membership plus role that authorizes them. Idempotent, so re-running the
      # job is safe.
      - name: Seed journey users
        run: node scripts/e2e/seed-browser-users.mjs

      - name: Seed stateful journey scenarios
        run: node scripts/e2e/seed-browser-scenarios.mjs

      - name: Use restricted application database roles
        run: |
          node scripts/db/setup-login-roles.mjs
          echo 'DATABASE_URL=postgresql://atlas_app_login:atlas_ci_app_only@localhost:5432/atlas_lms_ci' >> "$GITHUB_ENV"
          echo 'PLATFORM_DATABASE_URL=postgresql://atlas_platform_login:atlas_ci_platform_only@localhost:5432/atlas_lms_ci' >> "$GITHUB_ENV"

      - run: pnpm exec playwright install --with-deps chromium
      # SCORM playback (audit H2) in real Chromium with the production sandbox headers,
      # runtime injection and player bridge; a fixture server, so no app servers needed.
      - name: SCORM runtime bridge acceptance
        run: pnpm test:scorm-browser
      - name: Browser journeys and accessibility
        run: |
          # Two dev servers, Chromium, Postgres and the Supabase auth stack share this runner,
          # and journeys have failed on dropped proxy connections that neither server logged.
          # Memory snapshots go straight into this log: a cancelled job uploads no artifacts.
          echo "[runner] cpus=$(nproc)"
          (while sleep 30; do
            mem=$(free -m | awk '/^Mem:/ { printf "used=%sMB avail=%sMB", $3, $7 } /^Swap:/ { printf " swap=%sMB", $3 }')
            top=$(ps -eo rss=,comm= --sort=-rss | head -n 4 | awk '{ printf "%s=%dMB ", $2, $1 / 1024 }')
            echo "[runner] $(date -u +%T) $mem top: $top"
          done) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          pnpm exec playwright test
      - name: Verify critical journeys reject broken outcomes
        run: node scripts/e2e/verify-failure-probes.mjs
      - name: Report kernel out-of-memory kills
        if: ${{ failure() || cancelled() }}
        run: |
          sudo dmesg -T 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" ||
            echo "No kernel out-of-memory kills recorded."
      - name: Summarize local auth responses
        if: ${{ failure() || cancelled() }}
        run: |
          # The API reports every Supabase sign-in failure as invalid credentials, so a rejected
          # journey login cannot tell a wrong password from a rate limit (sign-ins are capped per
          # IP in supabase/config.toml). Counts of method, path and status only, never bodies.
          container=$(docker ps --format '{{.Names}}' | grep -m1 '^supabase_auth_' || true)
          if [ -z "$container" ]; then echo "No local auth container is running."; exit 0; fi
          docker logs "$container" 2>&1 |
            jq -Rr 'fromjson? | select(.path != null and .status != null) | "\(.method) \(.path) \(.status)"' |
            sort | uniq -c | sort -rn | head -n 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: playwright-report
          include-hidden-files: true
          path: |
            playwright-report/
            .test-results/f16-probes/evidence.json
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs:
      - workflow-validation
      - install
      - lint
      - format-check
      - typecheck
      - unit-tests
      - integration-tests
      - authorization-tests
      - static-suite-tests
      - tenant-isolation-tests
      - rls-tests
      - migration-validation
      - route-metadata-check
      - prisma-boundary-check
      - audit-compliance-check
      - outbox-compliance-check
      - forbidden-scope-check
      - zod-boundaries-check
      - permission-metadata-check
      - entitlement-metadata-check
      - tenant-resource-registry-check
      - audit-metadata-check
      - package-exports-check
      - outbox-worker-check
      - security-check
      - e2e-tests
      - release-evidence-validation
      - observability-contract-check
      - secret-scan
      - dependency-scan
      - container-scan
      - learner-bundle-boundary
      - frontend-api-closure
      - browser-smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
        run: pnpm db:generate:ci
      - run: pnpm build

  workflow-validation:
    name: workflow-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - name: Validate workflow syntax
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Verify CI dependency graph and fail-closed evidence
        run: pnpm exec vitest run tests/ci/ci-gate.test.ts tests/unit/release-readiness
        env:
          DATABASE_URL: ""
          PLATFORM_DATABASE_URL: ""

  ci-required:
    name: ci-required
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - workflow-validation
      - install
      - lint
      - format-check
      - typecheck
      - unit-tests
      - integration-tests
      - authorization-tests
      - static-suite-tests
      - tenant-isolation-tests
      - rls-tests
      - migration-validation
      - route-metadata-check
      - prisma-boundary-check
      - audit-compliance-check
      - outbox-compliance-check
      - forbidden-scope-check
      - zod-boundaries-check
      - permission-metadata-check
      - entitlement-metadata-check
      - tenant-resource-registry-check
      - audit-metadata-check
      - package-exports-check
      - outbox-worker-check
      - security-check
      - e2e-tests
      - release-evidence-validation
      - observability-contract-check
      - secret-scan
      - dependency-scan
      - container-scan
      - learner-bundle-boundary
      - frontend-api-closure
      - browser-smoke
      - build
      - release-health-check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Evaluate every job and write candidate evidence
        run: node scripts/ci/write-ci-evidence.mjs
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
      - name: Upload candidate CI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: ci-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence.json
          if-no-files-found: error
          retention-days: 30
