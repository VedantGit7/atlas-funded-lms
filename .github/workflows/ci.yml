name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
  push:
    branches:
      - main
      - develop
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_POSTGRES_USER: atlas
  CI_POSTGRES_PASSWORD: atlas_dev_password
  CI_POSTGRES_DB: atlas_lms_ci
  CI_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
  PRISMA_GENERATE_DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate

x-generate-prisma-client: &generate-prisma-client
  name: Generate Prisma client
  env:
    DATABASE_URL: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
  run: pnpm db:generate:ci

jobs:
  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - *generate-prisma-client
      - run: pnpm lint

  format-check:
    name: format-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - *generate-prisma-client
      - run: pnpm typecheck

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - *generate-prisma-client
      - run: pnpm test:unit

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
          POSTGRES_DB: atlas_lms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_lms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ env.CI_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - *generate-prisma-client
      - run: pnpm exec vitest run tests/db

  authorization-tests:
    name: authorization-tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:authorization

  tenant-isolation-tests:
    name: tenant-isolation-tests
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
          POSTGRES_DB: atlas_lms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_lms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      PLATFORM_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - *generate-prisma-client
      - run: pnpm test:tenant-isolation

  rls-tests:
    name: rls-tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:rls:check

  migration-validation:
    name: migration-validation
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
          POSTGRES_DB: atlas_lms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_lms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_POSTGRES_USER: atlas
      CI_POSTGRES_PASSWORD: atlas_dev_password
      CI_POSTGRES_DB: atlas_lms_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - *generate-prisma-client
      - run: node scripts/db/ci-migrate-validate.mjs

  route-metadata-check:
    name: route-metadata-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:route-metadata

  prisma-boundary-check:
    name: prisma-boundary-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:prisma-boundary

  audit-compliance-check:
    name: audit-compliance-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:audit-compliance

  outbox-compliance-check:
    name: outbox-compliance-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:outbox-compliance

  forbidden-scope-check:
    name: forbidden-scope-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:forbidden-scope

  zod-boundaries-check:
    name: zod-boundaries-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:zod-boundaries

  permission-metadata-check:
    name: permission-metadata-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:permission-metadata

  entitlement-metadata-check:
    name: entitlement-metadata-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:entitlement-metadata

  tenant-resource-registry-check:
    name: tenant-resource-registry-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:tenant-resource-registry

  security-check:
    name: security-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - *generate-prisma-client
      - run: pnpm security:check

  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
          POSTGRES_DB: atlas_lms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_lms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      PLATFORM_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - *generate-prisma-client
      - run: pnpm test:e2e

  release-evidence-validation:
    name: release-evidence-validation
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - *generate-prisma-client
      - run: pnpm release:suite -- --skip-db --skip-build --skip-e2e
      - run: test -f release-evidence.json

  observability-contract-check:
    name: observability-contract-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm observability:check

  release-health-check:
    name: release-health-check
    runs-on: ubuntu-latest
    needs: install
    if: ${{ vars.RELEASE_HEALTH_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm release:health -- --base-url "${{ vars.RELEASE_HEALTH_BASE_URL }}"
        env:
          RELEASE_HEALTH_EXPECTED_RELEASE: ${{ vars.RELEASE_HEALTH_EXPECTED_RELEASE }}

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:secrets

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  learner-bundle-boundary:
    name: learner-bundle-boundary
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - *generate-prisma-client
      - run: pnpm --filter @atlas/web build
      - run: pnpm ci:learner-bundle-boundary

  frontend-api-closure:
    name: frontend-api-closure
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:frontend-api-closure
        env:
          STRICT_API_CLOSURE: "1"

  browser-smoke:
    name: browser-smoke
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
          POSTGRES_DB: atlas_lms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_lms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      PLATFORM_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
      BROWSER_E2E: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - *generate-prisma-client
      - run: node scripts/db/ci-migrate-validate.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/browser/journeys/01-public-diagnostic-signup.spec.ts tests/browser/accessibility

  build:
    name: build
    runs-on: ubuntu-latest
    needs:
      - lint
      - format-check
      - typecheck
      - unit-tests
      - integration-tests
      - authorization-tests
      - tenant-isolation-tests
      - rls-tests
      - migration-validation
      - route-metadata-check
      - prisma-boundary-check
      - audit-compliance-check
      - outbox-compliance-check
      - forbidden-scope-check
      - zod-boundaries-check
      - permission-metadata-check
      - entitlement-metadata-check
      - tenant-resource-registry-check
      - security-check
      - e2e-tests
      - frontend-api-closure
      - learner-bundle-boundary
      - browser-smoke
      - release-evidence-validation
      - observability-contract-check
      - secret-scan
      - dependency-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile
      - *generate-prisma-client
      - run: pnpm build
