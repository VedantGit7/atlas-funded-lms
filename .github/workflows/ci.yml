name: CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
  push:
    branches:
      - main
      - develop
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_POSTGRES_USER: atlas
  CI_POSTGRES_PASSWORD: atlas_dev_password
  CI_POSTGRES_DB: atlas_lms_ci
  CI_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
  PRISMA_GENERATE_DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate

jobs:
  install:
    name: install
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
        run: pnpm db:generate:ci
      - run: pnpm check:server-authority
      - run: pnpm check:contracts
      - run: pnpm lint
      # `pnpm lint` runs per-directory shards because a single `eslint .`
      # OOM-aborted. Sharding trades a loud crash for a silent coverage hole, and
      # this asserts the shards still cover every file ESLint would lint. It has
      # existed since the sharding change and ran nowhere.
      - run: pnpm lint:coverage

  format-check:
    name: format-check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
        run: pnpm db:generate:ci
      - run: pnpm typecheck

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    services:
      supabase-security-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: atlas_f19_disposable_only
          POSTGRES_DB: atlas_f19_verification
        ports:
          - 15439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_f19_verification"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      cleanup-boundary-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: atlas_f20_disposable_only
          POSTGRES_DB: atlas_lms_test
        ports:
          - 15440:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      proctoring-integrity-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: atlas_f21_disposable_only
          POSTGRES_DB: atlas_lms_test
        ports:
          - 15442:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
        run: pnpm db:generate:ci
      - run: pnpm test:architecture
      - run: pnpm test:reliability-tooling
      - run: pnpm test:supabase-security
      - run: pnpm test:cleanup-boundary
      - run: pnpm test:cleanup-postgres
      - run: pnpm test:proctoring-integrity
      - run: pnpm test:unit
      - run: pnpm perf:tooling-tests

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
          POSTGRES_DB: atlas_lms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_lms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      F03_TEST_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      F07_TEST_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      F08_TEST_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      F14_TEST_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      F15_TEST_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      F04_TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      # Suites gate on both URLs being present and skip silently when either is
      # missing, so omitting this one turned with-platform-scope into a no-op.
      PLATFORM_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
        run: pnpm db:generate:ci
      # The postgres service starts empty; without this the suite runs against
      # a database with no schema.
      - run: pnpm db:provision
      - name: Initialize guarded test cleanup
        env:
          TEST_DATABASE_BOOTSTRAP_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
          TEST_DATABASE_ID: 3d1bfb95-3f55-4ca3-ade2-5d56a4bc6e20
          TEST_CLEANUP_PASSWORD: ci_cleanup_only_disposable
          TEST_DATABASE_DISPOSABLE: "1"
        run: |
          pnpm db:test:cleanup:init
          echo "TEST_DATABASE_ID=3d1bfb95-3f55-4ca3-ade2-5d56a4bc6e20" >> "$GITHUB_ENV"
          echo "TEST_CLEANUP_DATABASE_URL=postgresql://atlas_test_cleanup:ci_cleanup_only_disposable@localhost:5432/atlas_lms_ci" >> "$GITHUB_ENV"
          echo "ALLOW_DESTRUCTIVE_TEST_CLEANUP=1" >> "$GITHUB_ENV"
      # This job was named integration-tests and ran tests/db. All 65 files and
      # 258 tests under tests/integration ran in no CI job at all.
      - run: pnpm test:integration
      - run: pnpm test:db
      # tests/api and tests/ci -- 26 files, 127 tests -- were also unreferenced.
      - run: pnpm test:routes

  authorization-tests:
    name: authorization-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    # tests/authorization/{diagnostic,practice}.test.ts gate on DATABASE_URL and
    # PLATFORM_DATABASE_URL. Without a database they skipped, so this job was
    # green while the foreign-session denial checks never executed -- one of
    # them had in fact been failing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
          POSTGRES_DB: atlas_lms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_lms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      PLATFORM_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
        run: pnpm db:generate:ci
      - run: pnpm db:provision
      - name: Initialize guarded test cleanup
        env:
          TEST_DATABASE_BOOTSTRAP_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
          TEST_DATABASE_ID: 3d1bfb95-3f55-4ca3-ade2-5d56a4bc6e20
          TEST_CLEANUP_PASSWORD: ci_cleanup_only_disposable
          TEST_DATABASE_DISPOSABLE: "1"
        run: |
          pnpm db:test:cleanup:init
          echo "TEST_DATABASE_ID=3d1bfb95-3f55-4ca3-ade2-5d56a4bc6e20" >> "$GITHUB_ENV"
          echo "TEST_CLEANUP_DATABASE_URL=postgresql://atlas_test_cleanup:ci_cleanup_only_disposable@localhost:5432/atlas_lms_ci" >> "$GITHUB_ENV"
          echo "ALLOW_DESTRUCTIVE_TEST_CLEANUP=1" >> "$GITHUB_ENV"
      - run: pnpm test:authorization

  # tests/security, tests/events and tests/lint-rules need no database and ran
  # in no CI job. tests/lint-rules is the 33 structural checks relocated in
  # Phase 3 section 3.6 -- unwired, the relocation would have quietly dropped
  # them from CI entirely.
  static-suite-tests:
    name: static-suite-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
        run: pnpm db:generate:ci
      - run: pnpm test:security
      - run: pnpm test:events
      - run: pnpm test:structure

  tenant-isolation-tests:
    name: tenant-isolation-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
          POSTGRES_DB: atlas_lms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_lms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      PLATFORM_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
        run: pnpm db:generate:ci
      - run: pnpm db:provision
      - name: Initialize guarded test cleanup
        env:
          TEST_DATABASE_BOOTSTRAP_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
          TEST_DATABASE_ID: 3d1bfb95-3f55-4ca3-ade2-5d56a4bc6e20
          TEST_CLEANUP_PASSWORD: ci_cleanup_only_disposable
          TEST_DATABASE_DISPOSABLE: "1"
        run: |
          pnpm db:test:cleanup:init
          echo "TEST_DATABASE_ID=3d1bfb95-3f55-4ca3-ade2-5d56a4bc6e20" >> "$GITHUB_ENV"
          echo "TEST_CLEANUP_DATABASE_URL=postgresql://atlas_test_cleanup:ci_cleanup_only_disposable@localhost:5432/atlas_lms_ci" >> "$GITHUB_ENV"
          echo "ALLOW_DESTRUCTIVE_TEST_CLEANUP=1" >> "$GITHUB_ENV"

      # non-superuser-rls-backstop and tenant-domains-host-resolution connect as
      # the restricted login role and skip themselves without ATLAS_APP_LOGIN_URL,
      # which was set in no job. Those two cover the C5 backstop and the
      # tenant_domains host-resolution policy -- the two load-bearing RLS
      # guarantees in this programme -- so both were unverified in CI.
      - name: Set login role passwords
        run: pnpm db:setup-login-roles
        env:
          ATLAS_APP_LOGIN_PASSWORD: ci_app_login
          ATLAS_PLATFORM_LOGIN_PASSWORD: ci_platform_login

      - run: pnpm test:tenant-isolation
        env:
          ATLAS_APP_LOGIN_URL: postgresql://atlas_app_login:ci_app_login@localhost:5432/atlas_lms_ci?schema=public

  rls-tests:
    name: rls-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
          POSTGRES_DB: atlas_lms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_lms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate

      # RLS lives in sql/rls, not in migrations, so the schema must be fully
      # provisioned or the check inspects an empty database. check-rls-state.ts
      # now refuses to pass below 200 tenant tables for exactly that reason.
      - name: Provision database
        run: pnpm db:provision

      # Provisioning needs admin rights, but the RLS check must run as the role
      # production uses. A superuser bypasses RLS entirely, so checking as one
      # proves nothing — that is exactly how C5 went unnoticed.
      - name: Set login role passwords
        run: pnpm db:setup-login-roles
        env:
          ATLAS_APP_LOGIN_PASSWORD: ci_app_login
          ATLAS_PLATFORM_LOGIN_PASSWORD: ci_platform_login

      - name: Verify RLS as the non-superuser application role
        run: pnpm db:rls:check:ci
        env:
          DATABASE_URL: postgresql://atlas_app_login:ci_app_login@localhost:5432/atlas_lms_ci?schema=public
          REQUIRE_NON_SUPERUSER_DB: "1"

  migration-validation:
    name: migration-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
          POSTGRES_DB: atlas_lms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_lms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_POSTGRES_USER: atlas
      CI_POSTGRES_PASSWORD: atlas_dev_password
      CI_POSTGRES_DB: atlas_lms_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
        run: pnpm db:generate:ci
      - run: node scripts/db/ci-migrate-validate.mjs

  route-metadata-check:
    name: route-metadata-check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - run: pnpm check:route-metadata

  prisma-boundary-check:
    name: prisma-boundary-check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - run: pnpm check:prisma-boundary

  audit-compliance-check:
    name: audit-compliance-check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - run: pnpm check:audit-compliance

  outbox-compliance-check:
    name: outbox-compliance-check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - run: pnpm check:outbox-compliance

  forbidden-scope-check:
    name: forbidden-scope-check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

