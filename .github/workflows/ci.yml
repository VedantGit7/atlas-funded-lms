  release-evidence-validation:
    name: release-evidence-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: install
    # H18. This job ran the suite with --skip-db --skip-build --skip-e2e and then
    # asserted only `test -f release-evidence.json`. Eight P0 gates -- integration,
    # tenant isolation, RLS, e2e, tenant config, migration status, RLS policies
    # and the production build -- were skipped, and the artifact still read
    # READY_FOR_STAGING. Generating evidence about gates you did not run is worse
    # than generating none, because the artifact is then cited as proof.
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_dev_password
          POSTGRES_DB: atlas_lms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_lms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      F03_TEST_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      F07_TEST_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      F08_TEST_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      F14_TEST_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      F15_TEST_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      F04_TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
      PLATFORM_DATABASE_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://generate:generate@127.0.0.1:5432/generate
        run: pnpm db:generate:ci
      - run: pnpm db:provision
      - name: Initialize guarded test cleanup
        env:
          TEST_DATABASE_BOOTSTRAP_URL: postgresql://atlas:atlas_dev_password@localhost:5432/atlas_lms_ci
          TEST_DATABASE_ID: 3d1bfb95-3f55-4ca3-ade2-5d56a4bc6e20
          TEST_CLEANUP_PASSWORD: ci_cleanup_only_disposable
          TEST_DATABASE_DISPOSABLE: "1"
        run: |
          pnpm db:test:cleanup:init
          echo "TEST_DATABASE_ID=3d1bfb95-3f55-4ca3-ade2-5d56a4bc6e20" >> "$GITHUB_ENV"
          echo "TEST_CLEANUP_DATABASE_URL=postgresql://atlas_test_cleanup:ci_cleanup_only_disposable@localhost:5432/atlas_lms_ci" >> "$GITHUB_ENV"
          echo "ALLOW_DESTRUCTIVE_TEST_CLEANUP=1" >> "$GITHUB_ENV"

      - name: Set login role passwords
        run: pnpm db:setup-login-roles
        env:
          ATLAS_APP_LOGIN_PASSWORD: ci_app_login
          ATLAS_PLATFORM_LOGIN_PASSWORD: ci_platform_login

      - run: pnpm release:suite
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
          ATLAS_APP_LOGIN_URL: postgresql://atlas_app_login:ci_app_login@localhost:5432/atlas_lms_ci?schema=public

      # Freshness, commit correspondence, and verdict-versus-gates consistency.
      - run: pnpm release:evidence:validate
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Upload candidate release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 30

