# The disposable database the browser journeys, performance tools and deploy
# rehearsal run against. Login is Better Auth, whose accounts live in it
# (launch plan task 3.7), so there is no separate auth service.
name: atlas-f16-e2e
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_e2e_only_password
      POSTGRES_DB: atlas_lms_e2e
    ports:
      - "127.0.0.1:15436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_lms_e2e"]
      interval: 2s
      timeout: 2s
      retries: 30
