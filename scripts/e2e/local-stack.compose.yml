name: atlas-f16-e2e
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_e2e_only_password
      POSTGRES_DB: atlas_lms_e2e
    ports:
      - "127.0.0.1:15436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_lms_e2e"]
      interval: 2s
      timeout: 2s
      retries: 30
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.196.0
    depends_on:
      database:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:54326
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://atlas:atlas_e2e_only_password@database:5432/atlas_auth_e2e?sslmode=disable
      GOTRUE_SITE_URL: http://fundedbeyond.localhost:3100
      GOTRUE_URI_ALLOW_LIST: http://*.localhost:3100/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: atlas-f16-local-auth-secret-only-32-characters
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_MFA_ENABLED: "true"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
  gateway:
    image: public.ecr.aws/supabase/kong:2.8.1
    depends_on: [auth]
    ports:
      - "127.0.0.1:54326:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/local-auth.yml
      KONG_PLUGINS: cors
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PROXY_ACCESS_LOG: "off"
      KONG_ADMIN_ACCESS_LOG: "off"
    volumes:
      - ./local-auth-kong.yml:/usr/local/kong/local-auth.yml:ro
