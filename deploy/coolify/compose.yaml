# The Atlas web, API and worker services as one Coolify Docker Compose resource
# (docs/runbooks/coolify-deployment.md). Coolify passes a setting to a container
# only when that service lists it here as ${VAR}; each one then appears as an
# editable variable in Coolify. ${VAR:?} marks it required.
#
# Images come from the "Publish images" workflow. APP_ENV and RELEASE_SHA pick
# them, so deploying a commit means changing RELEASE_SHA. The API and web images
# are per environment; the worker image is shared.
#
# Lists are per service: each one gets what its startup validation requires
# plus the settings it uses, and no more. Optional settings Coolify would leave
# empty are not listed at all, because some parsers reject an empty string.
#
# No ports are published and no networks are declared: Traefik reaches web over
# Coolify's own network, and a second network makes its routing unreliable.
# Only web gets a domain in Coolify (container port 3000).
services:
  web:
    image: ghcr.io/vedantgit7/atlas-web:${APP_ENV:?}-${RELEASE_SHA:?}
    # The deployment contract allows plain HTTP to the API only for a .internal
    # name, which can never resolve publicly. The link gives web that alias on
    # Coolify's network without a second network.
    links:
      - api:api.atlas.internal
    environment:
      # Trust Coolify's CA, which signs PostgreSQL's TLS certificate: pg treats
      # sslmode=require as verify-full, and the contract forbids sslrootcert.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/coolify-ca.crt
      API_INTERNAL_URL: http://api.atlas.internal:3001
      # Three server processes on one port (deploy/managed-node/server-cluster.mjs).
      # Every API call passes through web, and in the staging burst profile its
      # one process saturated whenever the API's three did. The heaviest load so
      # far used 370 MiB in one process, so 512 MiB heaps leave room. Web opens no
      # database pools today; these keep it inside the connection budget if a
      # route ever does.
      WEB_PROCESS_COUNT: "3"
      WEB_PROCESS_HEAP_MB: "512"
      DATABASE_POOL_MAX: "2"
      PLATFORM_DATABASE_POOL_MAX: "1"
      API_PROXY_SECRET: ${API_PROXY_SECRET:?}
      APP_ENV: ${APP_ENV:?}
      APP_URL: ${APP_URL:?}
      BETTER_STACK_WORKER_HEARTBEAT_URL: ${BETTER_STACK_WORKER_HEARTBEAT_URL:?}
      CERTIFICATE_OPEN_BADGE: ${CERTIFICATE_OPEN_BADGE:-false}
      CRON_SECRET: ${CRON_SECRET:?}
      CSP_ENFORCE: "1"
      DATABASE_URL: ${DATABASE_URL:?}
      INTERNAL_WORKER_SECRET: ${INTERNAL_WORKER_SECRET:?}
      LEARNER_BILLING_ENC_KEY: ${LEARNER_BILLING_ENC_KEY:?}
      # Off until marketing email has its own provider: the SMTP agent is ZeptoMail,
      # which allows only transactional mail.
      MARKETING_EMAIL_ENABLED: ${MARKETING_EMAIL_ENABLED:-false}
      # The per-request CSP reads this at runtime to admit the browser's Sentry
      # reports. It is the same DSN the web image was built with.
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN:?}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:?}
      NOTIFICATION_EMAIL_PROVIDER: smtp
      OBSERVABILITY_HASH_SALT: ${OBSERVABILITY_HASH_SALT:?}
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL:?}
      PLATFORM_HOST: ${PLATFORM_HOST:?}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:?}
      RELEASE_ENV: ${APP_ENV:?}
      RELEASE_SHA: ${RELEASE_SHA:?}
      SENTRY_DSN: ${SENTRY_DSN:?}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?}
      STORAGE_PROVIDER: r2
      # Cloudflare sets this header and the firewall admits only Cloudflare.
      TRUSTED_CLIENT_IP_HEADER: cf-connecting-ip
      TRUSTED_PROXY_HOPS: "0"
    volumes:
      # Created on the server when SSL is turned on for Coolify's PostgreSQL.
      - /data/coolify/ssl/coolify-ca.crt:/etc/ssl/certs/coolify-ca.crt:ro
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    # Room for the three processes above: 3 x 512 MiB heap plus native memory.
    mem_limit: 2g
    cpus: 4
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    # A public file served through the middleware: cheap and independent of
    # the API, and 500 whenever startup validation failed. A misconfigured
    # container keeps running and answers 500, so only this check catches it.
    # healthcheck.mjs restarts a container after 3 failures in a row once
    # --grace (start_period) has passed; Docker alone never would.
    healthcheck:
      test:
        [
          CMD,
          node,
          /app/healthcheck.mjs,
          --url,
          "http://127.0.0.1:3000/brand/avatar-gradient.svg",
          --grace,
          "60",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  api:
    image: ghcr.io/vedantgit7/atlas-api:${APP_ENV:?}-${RELEASE_SHA:?}
    environment:
      # Trust Coolify's CA, which signs PostgreSQL's TLS certificate: pg treats
      # sslmode=require as verify-full, and the contract forbids sslrootcert.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/coolify-ca.crt
      API_INTERNAL_URL: http://api.atlas.internal:3001
      # Five server processes on one port (deploy/managed-node/server-cluster.mjs).
      # One process saturated a core at about 75 requests a second in the
      # staging load test while the host stayed half idle, and in the 500-learner
      # burst three still saturated together while the host had about two cores
      # spare. Three used 1.9 GiB at most, so each gets a 768 MiB heap. Each
      # opens its own pools, sized so five of them, web and the worker stay under
      # PostgreSQL's 100 connections (pools open only on demand).
      API_PROCESS_COUNT: "5"
      API_PROCESS_HEAP_MB: "768"
      # Web's proxy reuses its most recent connection first, so without this a
      # few kept-alive connections, and the processes holding them, carried most
      # requests (35/21/44% across three). Closing a connection after 100
      # requests moves its traffic to the next process.
      API_MAX_REQUESTS_PER_SOCKET: "100"
      AUTH_DATABASE_POOL_MAX: "2"
      DATABASE_POOL_MAX: "4"
      PLATFORM_DATABASE_POOL_MAX: "3"
      API_PROXY_SECRET: ${API_PROXY_SECRET:?}
      APP_ENV: ${APP_ENV:?}
      APP_URL: ${APP_URL:?}
      ATLAS_SERVICE_RUNTIME: managed-node
      # Better Auth signs sessions and encrypts authenticators with this.
      # The sign-in page always offers Google, so its client is required too.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_STACK_WORKER_HEARTBEAT_URL: ${BETTER_STACK_WORKER_HEARTBEAT_URL:?}
      CERTIFICATE_OPEN_BADGE: ${CERTIFICATE_OPEN_BADGE:-false}
      CRON_SECRET: ${CRON_SECRET:?}
      DATABASE_URL: ${DATABASE_URL:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?}
      INTERNAL_WORKER_SECRET: ${INTERNAL_WORKER_SECRET:?}
      LEARNER_BILLING_ENC_KEY: ${LEARNER_BILLING_ENC_KEY:?}
      # Off until marketing email has its own provider: the SMTP agent is ZeptoMail,
      # which allows only transactional mail.
      MARKETING_EMAIL_ENABLED: ${MARKETING_EMAIL_ENABLED:-false}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:?}
      NOTIFICATION_EMAIL_PROVIDER: smtp
      OBSERVABILITY_HASH_SALT: ${OBSERVABILITY_HASH_SALT:?}
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL:?}
      PLATFORM_HOST: ${PLATFORM_HOST:?}
      PORT: "3001"
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:?}
      RELEASE_ENV: ${APP_ENV:?}
      RELEASE_SHA: ${RELEASE_SHA:?}
      SCORM_CONTENT_SIGNING_KEYS: ${SCORM_CONTENT_SIGNING_KEYS:?}
      SENTRY_DSN: ${SENTRY_DSN:?}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?}
      STORAGE_PROVIDER: r2
      # The most one tenant's members can make together each minute
      # (docs/runbooks/rate-limiting.md); the defaults match the code's.
      TENANT_RATE_LIMIT_READS_PER_MINUTE: ${TENANT_RATE_LIMIT_READS_PER_MINUTE:-12000}
      TENANT_RATE_LIMIT_WRITES_PER_MINUTE: ${TENANT_RATE_LIMIT_WRITES_PER_MINUTE:-3000}
    volumes:
      # Created on the server when SSL is turned on for Coolify's PostgreSQL.
      - /data/coolify/ssl/coolify-ca.crt:/etc/ssl/certs/coolify-ca.crt:ro
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    # Room for the five processes above: 5 x 768 MiB heap plus native memory.
    mem_limit: 5g
    cpus: 5
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    # No database call: a 200 means the server started and passed validation.
    healthcheck:
      test:
        [
          CMD,
          node,
          /app/healthcheck.mjs,
          --url,
          "http://127.0.0.1:3001/api/v1/health",
          --grace,
          "60",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  worker:
    image: ghcr.io/vedantgit7/atlas-worker:${RELEASE_SHA:?}
    environment:
      # Trust Coolify's CA, which signs PostgreSQL's TLS certificate: pg treats
      # sslmode=require as verify-full, and the contract forbids sslrootcert.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/coolify-ca.crt
      API_INTERNAL_URL: http://api.atlas.internal:3001
      APP_ENV: ${APP_ENV:?}
      APP_URL: ${APP_URL:?}
      ATLAS_SERVICE_RUNTIME: managed-node
      BETTER_STACK_WORKER_HEARTBEAT_URL: ${BETTER_STACK_WORKER_HEARTBEAT_URL:?}
      CERTIFICATE_OPEN_BADGE: ${CERTIFICATE_OPEN_BADGE:-false}
      CRON_SECRET: ${CRON_SECRET:?}
      DATABASE_URL: ${DATABASE_URL:?}
      INTERNAL_WORKER_SECRET: ${INTERNAL_WORKER_SECRET:?}
      LEARNER_BILLING_ENC_KEY: ${LEARNER_BILLING_ENC_KEY:?}
      # Off until marketing email has its own provider: the SMTP agent is ZeptoMail,
      # which allows only transactional mail.
      MARKETING_EMAIL_ENABLED: ${MARKETING_EMAIL_ENABLED:-false}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:?}
      NOTIFICATION_EMAIL_PROVIDER: smtp
      OBSERVABILITY_HASH_SALT: ${OBSERVABILITY_HASH_SALT:?}
      # The worker sweeps one tenant and processor at a time; smaller pools
      # keep it, web and the API's processes under PostgreSQL's 100 connections.
      DATABASE_POOL_MAX: "10"
      OUTBOX_WORKER_BATCH_LIMIT: "25"
      OUTBOX_WORKER_HEALTH_PORT: "8081"
      OUTBOX_WORKER_SHUTDOWN_TIMEOUT_MS: "30000"
      PLATFORM_DATABASE_POOL_MAX: "5"
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL:?}
      PLATFORM_HOST: ${PLATFORM_HOST:?}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:?}
      RELEASE_ENV: ${APP_ENV:?}
      RELEASE_SHA: ${RELEASE_SHA:?}
      SENTRY_DSN: ${SENTRY_DSN:?}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?}
      STORAGE_PROVIDER: r2
    volumes:
      # Created on the server when SSL is turned on for Coolify's PostgreSQL.
      - /data/coolify/ssl/coolify-ca.crt:/etc/ssl/certs/coolify-ca.crt:ro
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 2g
    cpus: 2
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 256m
    healthcheck:
      test:
        [CMD, node, /app/healthcheck.mjs, --url, "http://127.0.0.1:8081/healthz", --grace, "120"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
