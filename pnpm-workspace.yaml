packages:
  - "frontend/apps/*"
  - "frontend/packages/*"
  - "backend/apps/*"
  - "backend/packages/*"
  - "backend/packages/domain/*"
  - "backend/packages/tenant-config"
  - "backend/packages/release-readiness"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - nanoid

# Transitive advisories with no direct dependency to bump. Each key is scoped to
# the vulnerable range so the override lifts only the affected copy and leaves
# other consumers on the major they were resolved against.
#
# `extract-zip` is deliberately absent -- see the auditConfig note at the bottom.
overrides:
  # Three separate advisories, one per major line. The 1.x copy is not dev-only:
  # it reaches production through exceljs -> archiver -> glob -> minimatch.
  "brace-expansion@<1.1.16": "^1.1.16"
  "brace-expansion@>=2.0.0 <2.1.2": "^2.1.2"
  "brace-expansion@>=5.0.0 <5.0.7": "^5.0.7"
  "@hono/node-server@<1.19.13": "^1.19.13"
  "body-parser@<1.20.6": "^1.20.6"
  "cookie@<0.7.0": "^0.7.0"
  "deepmerge-ts@<8.0.0": "^8.0.0"
  "dompurify@<3.4.13": "^3.4.13"
  # Four advisories (host confusion x2, SSRF x2) land above the previous
  # ceiling: the old override lifted <=3.1.3 to ^3.1.4 and the tree resolved
  # 3.1.5, which is itself affected. Reaches the build through ajv, via both
  # prisma and @sentry/nextjs -> webpack -> schema-utils.
  "fast-uri@<3.1.6": "^3.1.6"
  "hono@<4.13.5": "^4.13.5"
  # F12: retain each consumer's fflate minor line and use its ZIP64 fix.
  "fflate@>=0.4.5 <0.4.9": "^0.4.9"
  "fflate@>=0.6.0 <0.6.11": "^0.6.11"
  # Fix both query-parser DoS advisories in the Lighthouse tooling tree.
  "qs@<6.16.0": "^6.16.0"
  "baseline-browser-mapping@>=2.0.0 <2.11.0": "^2.11.0"
  "ip-address@<=10.3.0": "^10.3.1"
  # maxTotalMergeKeys does not bound CPU on merge keys. The previous floor
  # (^3.15.0) resolved 3.15.1, which is still affected. Scoped to the 3.x
  # line that @lhci/utils pins; 5.x consumers are untouched.
  "js-yaml@<3.15.2": "^3.15.2"
  # Unbounded cache growth and a prototype-write crash on untrusted queries.
  # Two copies resolve; only 4.28.2 is affected, reached through
  # update-browserslist-db and the web app build.
  "browserslist@<4.28.7": "^4.28.7"
  # Auth-plugin downgrade to mysql_clear_password. Arrives through prisma,
  # which ships drivers for every engine it supports; nothing in this
  # Postgres-only codebase imports it, so the override is belt and braces
  # rather than a reachable fix.
  "mysql2@<3.22.0": "^3.22.0"
  "nanoid@<3.3.16": "^3.3.16"
  "postcss@<=8.5.17": "^8.5.18"
  "shell-quote@<=1.8.4": "^1.8.5"
  "tmp@<0.2.6": "^0.2.6"
  # exceljs pulls uuid only for v4; the advisory is a bounds check in v3/v5/v6
  # when an explicit `buf` is passed, so it was never reachable here. Bumped
  # anyway because uuid still ships a CJS build and exceljs keeps working.
  "uuid@<11.1.1": "^11.1.1"
  "valibot@<1.4.2": "^1.4.2"

# GHSA-jmr9-qjv8-65gv and GHSA-7pqw-9j4j-h8q3 (extract-zip, symlink path
# traversal / arbitrary file write through symlink archive entries, both high).
#
# This is NOT a judgement that the advisory is unimportant -- it is unfixable
# today: 2.0.1 is the latest published release of extract-zip, so the "patched
# >=2.0.2" version does not exist yet. The only path into the tree is
#   @lhci/cli (devDependency) -> lighthouse -> puppeteer-core -> @puppeteer/browsers
# so it never ships in the application runtime, and the archives it extracts are
# Chrome builds fetched by Lighthouse rather than user-supplied uploads.
#
# Ignored here so `pnpm security:check` fails loudly on any NEW advisory instead
# of being permanently red on one nobody can act on. Tracked as SEC-09 in
# docs/release/security-exception-register.md -- revisit when extract-zip
# publishes a fix or @lhci/cli moves off puppeteer.
# F12 rechecked 2026-09-20: npm still publishes 2.0.1 as latest; an unfiltered
# audit returns only these two existing exceptions after the security updates.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    # Second advisory id for the same defect in the same package, published
    # after the first was suppressed. Same unavailable fix, same single path,
    # so the reasoning above applies unchanged -- but it had to be named
    # explicitly, because suppressing by id is what keeps a NEW advisory loud.
    - GHSA-7pqw-9j4j-h8q3

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
