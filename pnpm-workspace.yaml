packages:
  - "frontend/apps/*"
  - "frontend/packages/*"
  - "backend/apps/*"
  - "backend/packages/*"
  - "backend/packages/domain/*"
  - "backend/packages/tenant-config"
  - "backend/packages/release-readiness"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - nanoid

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
