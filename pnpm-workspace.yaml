packages:
  - "frontend/apps/*"
  - "frontend/packages/*"
  - "backend/apps/*"
  - "backend/packages/*"
  - "backend/packages/domain/*"
  - "backend/packages/tenant-config"
  - "backend/packages/release-readiness"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - nanoid

# Transitive advisories with no direct dependency to bump. Each key is scoped to
# the vulnerable range so the override lifts only the affected copy and leaves
# other consumers on the major they were resolved against.
overrides:
  # Three separate advisories, one per major line. The 1.x copy is not dev-only:
  # it reaches production through exceljs -> archiver -> glob -> minimatch.
  # Raised again (2026-10-01): two further recursion DoS advisories per line,
  # patched in 1.1.20 / 2.1.6 / 5.0.11.
  "brace-expansion@<1.1.20": "^1.1.20"
  "brace-expansion@>=2.0.0 <2.1.6": "^2.1.6"
  "brace-expansion@>=4.0.0 <5.0.11": "^5.0.11"
  # Reached through jsdom: in tests (vitest) and in production through
  # isomorphic-dompurify (the storage package and the web app). WebSocket DoS,
  # TLS validation bypass and cache poisoning were fixed in 8.10.2. Raised
  # (2026-10-24): DoS through excessive content-encodings, fixed in 8.12.2.
  "undici@>=8.0.0 <8.12.2": "^8.12.2"
  "@hono/node-server@<1.19.13": "^1.19.13"
  "deepmerge-ts@<8.0.0": "^8.0.0"
  # Raised (2026-10-04): IN_PLACE sanitising with a node-removing afterSanitize
  # hook left event handlers armed (low; we use neither). Raised again
  # (2026-10-23): a critical and a high advisory, both fixed in 3.4.17.
  # Production: the web app via isomorphic-dompurify and posthog-js.
  "dompurify@<3.4.17": "^3.4.17"
  # Four advisories (host confusion x2, SSRF x2) land above the previous
  # ceiling: the old override lifted <=3.1.3 to ^3.1.4 and the tree resolved
  # 3.1.5, which is itself affected. Reaches the build through ajv, via both
  # prisma and @sentry/nextjs -> webpack -> schema-utils. Raised (2026-10-25):
  # scheme spoofing, host confusion and two low advisories, fixed in 3.1.9.
  "fast-uri@<3.1.9": "^3.1.9"
  "hono@<4.13.5": "^4.13.5"
  # F12: retain each consumer's fflate minor line and use its ZIP64 fix.
  "fflate@>=0.4.5 <0.4.9": "^0.4.9"
  "fflate@>=0.6.0 <0.6.11": "^0.6.11"
  "baseline-browser-mapping@>=2.0.0 <2.11.0": "^2.11.0"
  # Raised (2026-11-20): ReDoS in Schema.TemplateLiteral's compiled regex
  # (GHSA-7589-6fvf-x4pw, CVE-2026-121707, high), fixed in 3.22.1. Prisma pins
  # 3.20.0 through @prisma/config (config loading for migrate and generate) and
  # better-auth's Prisma adapter brings it again; a minor upgrade on the same
  # major line.
  "effect@<3.22.1": "^3.22.1"
  # Unbounded cache growth and a prototype-write crash on untrusted queries.
  # Two copies resolve; only 4.28.2 is affected, reached through
  # update-browserslist-db and the web app build.
  "browserslist@<4.28.7": "^4.28.7"
  # Auth-plugin downgrade to mysql_clear_password. Arrives through prisma,
  # which ships drivers for every engine it supports; nothing in this
  # Postgres-only codebase imports it, so the override is belt and braces
  # rather than a reachable fix.
  "mysql2@<3.22.0": "^3.22.0"
  "nanoid@<3.3.16": "^3.3.16"
  "postcss@<=8.5.17": "^8.5.18"
  # Raised (2026-10-06): quote() command injection via a line terminator in a
  # token after a comment token (critical), fixed in 1.11.0. Dev tooling only:
  # concurrently pins an exact older copy in every release so far.
  "shell-quote@<1.11.0": "^1.11.0"
  "tmp@<0.2.6": "^0.2.6"
  # exceljs pulls uuid only for v4; the advisory is a bounds check in v3/v5/v6
  # when an explicit `buf` is passed, so it was never reachable here. Bumped
  # anyway because uuid still ships a CJS build and exceljs keeps working.
  "uuid@<11.1.1": "^11.1.1"
  "valibot@<1.4.2": "^1.4.2"
  # Raised (2026-10-06): indexed source-map section offsets could stall the
  # event loop. Build tooling (postcss via next, vite and tailwind); fixed in
  # 1.2.2.
  "source-map-js@<1.2.2": "^1.2.2"
  # Raised (2026-10-21): the bundled launch-editor's fs.existsSync() existence
  # check can be bypassed on Windows (GHSA-587h-7wmj-h5pm, high), fixed in
  # vite 8.1.6. Dev and test tooling: vitest and @sentry/nextjs's server utils.
  "vite@>=8.0.0 <8.1.6": "^8.1.6"
  # Raised (2026-10-06): librsvg vulnerability in the libvips sharp bundles
  # (CVE-2026-96889), fixed in 0.35.5. Production: next's image optimizer in the
  # web and API apps. next's own range (^0.35.4) already admits the fix; the
  # override keeps a lockfile refresh from resolving below it.
  "sharp@<0.35.5": "^0.35.5"

auditConfig:
  # Suppressed by advisory id, so any NEW advisory still fails security:check.
  # The extract-zip pair (SEC-09) went with @lhci/cli, its only path in; the
  # node-forge one (SEC-10) was fixed by upgrading to 1.4.2.
  ignoreGhsas:
    # picomatch ReDoS through single-branch repeated extglobs (high). Widened on
    # 17 Nov 2026 to every version through 4.0.7, the latest, with no patched
    # release. Not reachable: the only production path is @sentry/nextjs ->
    # @rollup/plugin-commonjs, which runs at build time on our own source, and
    # nothing passes a request's input to picomatch as a pattern; the other
    # paths are dev tooling (lint-staged and friends). Remove this entry once
    # picomatch ships a fix and the tree is upgraded to it.
    - GHSA-fc5q-39xc-vjpf

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
