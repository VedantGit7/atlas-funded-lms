packages:
  - "apps/*"
  - "packages/*"
  - "packages/domain/config"
  - "packages/domain/tenancy"
  - "packages/domain/branding"
  - "packages/domain/identity"
  - "packages/domain/access"
  - "packages/tenant-config"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - nanoid

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
